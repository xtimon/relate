[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relate"
version = "0.1.0"
description = "Relational Evolutionary Lattice for Algorithmic Time and Experience"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
jupyter = ["ipython>=8.0"]
dev     = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["relate*"]
