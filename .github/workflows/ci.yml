name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check relate/ tests/

      - name: Check formatting with ruff
        run: |
          ruff format --check relate/ tests/

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short --cov=relate --cov-report=term-missing

      - name: Verify examples import cleanly
        run: |
          python -c "
          import relate
          from relate import (
              RealityState, RealitySimulation,
              generate_moves, apply_move, score_move_cheap,
              compute_curvature, compute_integrated_info,
              spectral_dimension, network_summary,
              create_perfect_animation, plot_final_universe,
          )
          print('All imports OK')
          "

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy

      - name: Type check with mypy
        run: |
          mypy relate/ --ignore-missing-imports --check-untyped-defs
        continue-on-error: true

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - quantum_breath
          - thermodynamics
          - hub_mechanism
          - initial_topology
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx  # for matplotlib

      - name: Run ${{ matrix.example }}
        run: |
          python examples/${{ matrix.example }}.py
        timeout-minutes: 10
